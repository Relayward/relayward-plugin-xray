name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: shellcheck scripts/build-release.sh
      - run: ./scripts/build-release.sh 0.0.0-ci /tmp/relayward-plugin-xray-release
      - run: cd /tmp/relayward-plugin-xray-release && sha256sum -c SHA256SUMS

